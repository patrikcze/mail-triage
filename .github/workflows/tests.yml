name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
        python: ["3.11", "3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      # Standard library only: no dependencies to install. Tests use synthetic mail and fakes,
      # so no model, no Mail access and no network are needed.
      - run: python -m unittest discover -s tests -v
      - run: python triage.py --version
      - run: python triage.py categories
